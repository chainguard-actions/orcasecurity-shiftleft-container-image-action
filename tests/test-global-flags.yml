name: Test global CLI flags (config, display_name, log_path, exit_code, control_timeout)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare config file and log dir inside the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/orca-test-files/logs"
          cat > "$GITHUB_WORKSPACE/orca-test-files/orca-config.yaml" <<'EOF'
          no-color: true
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-orca-token"
          project_key: "test-project"
          image: "alpine:3.19"
          exit_code: "3"
          config: "orca-test-files/orca-config.yaml"
          display_name: "act-harness-scan"
          log_path: "orca-test-files/logs"
          control_timeout: "60"
          debug: "true"
          disable_err_report: "true"
          no_color: "true"
      - name: Assert action ran the CLI and failed (invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output is 0 but step failed"
            exit 1
          fi
          echo "PASS"
