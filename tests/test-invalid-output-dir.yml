name: Test output not a folder fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "dummy-orca-token"
          project_key: "test-project"
          image: "alpine:3.19"
          output: "results-file-not-a-dir.json"
      - name: Assert action failed validation before scanning
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when output is not a folder"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            echo "FAIL: scan should not have run (exit_code output set)"
            exit 1
          fi
          echo "PASS"
