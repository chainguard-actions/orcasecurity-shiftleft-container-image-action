name: Test scan with scan flag inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-orca-token"
          project_key: "test-project"
          image: "alpine:3.19"
          output: "orca-out/"
          format: "sarif"
          console_output: "table"
          control_timeout: "60"
          ignore_failed_exec_controls: "true"
          num_cpu: "2"
          max_secret: "10"
          exclude_paths: "./notToBeScanned/,example.tf"
          custom_secret_controls: "hardened/tests/fixtures/custom-secret-controls.yaml"
          exceptions_filepath: "hardened/tests/fixtures/exceptions.yaml"
          disable_err_report: "true"
          no_color: "true"
          timeout: "2m"
      - name: Assert scan ran and reported an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code output: '$EXIT_CODE'"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$EXIT_CODE" != "0" ]; then
              echo "FAIL: action succeeded but exit_code output is '$EXIT_CODE'"
              exit 1
            fi
            echo "PASS: scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: step failed but exit_code output is 0"
              exit 1
            fi
            echo "PASS: scan failed as expected with invalid Orca credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
