name: Test scan flags (timeout, num_cpu, max_secret, exclude_paths, exceptions, custom secrets, console_output, oci)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare exceptions and custom secret controls files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/orca-test-files"
          cat > "$GITHUB_WORKSPACE/orca-test-files/exceptions.yaml" <<'EOF'
          exceptions: []
          EOF
          cat > "$GITHUB_WORKSPACE/orca-test-files/custom-secrets.yaml" <<'EOF'
          controls: []
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-orca-token"
          project_key: "test-project"
          image: "alpine:3.19"
          timeout: "5m"
          ignore_failed_exec_controls: "true"
          num_cpu: "2"
          max_secret: "10"
          exclude_paths: "./notToBeScanned/,example.tf"
          exceptions_filepath: "orca-test-files/exceptions.yaml"
          custom_secret_controls: "orca-test-files/custom-secrets.yaml"
          output: "orca_scan_out/"
          console_output: "table"
          format: "json"
          oci: "false"
          disable_err_report: "true"
          no_color: "true"
      - name: Assert action ran the CLI and failed (invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output is 0 but step failed"
            exit 1
          fi
          echo "PASS"
