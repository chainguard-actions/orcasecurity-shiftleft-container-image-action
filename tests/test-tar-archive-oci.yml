name: Test tar archive OCI image scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare a placeholder tar archive in the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/orca-test-files/img"
          echo '{}' > "$GITHUB_WORKSPACE/orca-test-files/img/index.json"
          tar -cf "$GITHUB_WORKSPACE/orca-test-files/image.tar" -C "$GITHUB_WORKSPACE/orca-test-files/img" .
          ls -la "$GITHUB_WORKSPACE/orca-test-files"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-orca-token"
          project_key: "test-project"
          image: "local-image:latest"
          tar_archive: "orca-test-files/image.tar"
          oci: "true"
          disable_err_report: "true"
          no_color: "true"
      - name: Assert action ran and failed (invalid token / placeholder archive)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output is 0 but step failed"
            exit 1
          fi
          echo "PASS"
