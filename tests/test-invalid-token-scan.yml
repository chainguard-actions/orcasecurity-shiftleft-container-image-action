name: Test scan with invalid Orca token runs CLI and reports non-zero exit code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: "invalid-orca-token"
          project_key: "test-project"
          image: "alpine:3.19"
          output: "orca_out/"
          format: "json"
          no_color: "true"
          disable_err_report: "true"
      - name: Assert scan ran and failed with non-zero exit_code
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output is 0 but step failed"
            exit 1
          fi
          echo "PASS"
